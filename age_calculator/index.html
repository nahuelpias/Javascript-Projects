<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Age Calculator</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Cutive+Mono&display=swap");
      .cutive-mono-regular {
        font-family: "Cutive Mono", monospace;
        font-weight: 600;
        font-style: normal;
      }
    </style>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div
      class="min-h-screen bg-gray-100 flex flex-col items-center justify-center p-6"
    >
      <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
        <h1 class="text-center text-2xl cutive-mono-regular mb-6">
          Age Calculator
        </h1>

        <div>
          <label
            class="block text-sm font-medium text-gray-700 mb-2"
            for="calendar"
            >Date of birth:</label
          >
          <input
            type="text"
            id="calendar"
            autocomplete="off"
            readonly
            required
            placeholder="Select your birth date"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
          />
        </div>
        <div
          class="mt-6 p-4 bg-blue-50 border-l-4 border-blue-500 text-blue-700 hidden"
          id="result"
        ></div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/luxon@3/build/global/luxon.min.js"></script>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/vanillajs-datepicker@1.3/dist/css/datepicker.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/vanillajs-datepicker@1.3/dist/js/datepicker-full.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="app.js"></script>
  </body>
</html>
